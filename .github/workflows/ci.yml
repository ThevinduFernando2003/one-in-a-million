name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build, stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Local Redis + serverless-redis-http (SRH), so @upstash/redis runs offline.
      - name: Configure local Redis credentials
        run: cp .env.example .env.local

      # lint → format → typecheck → Redis up → unit + integration tests →
      # production build → 5,000-request HTTP stress test.
      - run: npm run verify

      - name: Stop Redis
        if: always()
        run: docker compose down
