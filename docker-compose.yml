# Local, offline stand-in for Upstash Redis.
#
#   redis  - a real Redis server (the Lua script runs here, single-threaded).
#   srh    - serverless-redis-http: speaks the Upstash REST protocol so the
#            unmodified @upstash/redis client works against local Redis.
#
# Start: docker compose up -d     Stop: docker compose down
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  srh:
    image: hiett/serverless-redis-http:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: oiam-local-dev-token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    ports:
      - "8079:80"
